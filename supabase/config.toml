# Local authentication verification only. No hosted project is linked.
project_id = "trizon-auth"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.seed]
enabled = false

[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

# Password sign-in exists only in the isolated local test runner, never in app routes.
[auth.email]
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 1000
token_refresh = 1000

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/trizon_auth/before_user_created"

[experimental]
stack = true
