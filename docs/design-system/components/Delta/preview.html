<!-- @dsCard group="Numbers" height=140 subtitle="상승, 하락, 변동 없음 — 크기별" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Delta — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-stack tz-pad" style="background:var(--surface-raised)">
  <div class="tz-row" style="gap:var(--spacing-2xl)">
    <span class="tz-delta tz-rise"><span class="figure-lg">+¥1,000</span><span class="body-sm">+5.26%</span></span>
    <span class="tz-delta tz-fall"><span class="figure-lg">-$8.00</span><span class="body-sm">-3.33%</span></span>
    <span class="tz-delta tz-flat"><span class="figure-lg">0</span><span class="body-sm">0.00%</span></span>
  </div>
  <div class="tz-row" style="gap:var(--spacing-xl)">
    <span class="tz-delta tz-rise"><span class="body-sm">+¥2,000</span><span class="caption">+20.00%</span></span>
    <span class="tz-delta tz-fall"><span class="body-sm">-¥200</span><span class="caption">-2.44%</span></span>
    <span class="tz-delta tz-flat"><span class="body-sm">0</span></span>
  </div>
  <div class="tz-row">
    <span class="tz-pill tz-rise label">+¥300 오늘</span>
    <span class="tz-pill tz-fall label">-$1.00 오늘</span>
    <span class="tz-pill tz-flat label">0 오늘</span>
  </div>
</div>
</body>
</html>
