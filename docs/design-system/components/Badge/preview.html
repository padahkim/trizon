<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Badge — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-row tz-pad" style="background:var(--surface-raised)">
  <span class="tz-badge badge">현금 제외</span>
  <span class="tz-badge tz-badge-warning badge"><svg class="tz-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg>시세 없음</span>
  <span class="tz-badge tz-badge-warning badge">환차손익 빠짐</span>
  <span class="tz-badge tz-badge-danger badge"><span class="tz-dot"></span>동기화 실패</span>
  <span class="tz-badge tz-badge-ok badge"><span class="tz-dot"></span>연결됨</span>
  <span class="tz-badge badge">지원 안 됨</span>
  <span class="tz-badge tz-badge-outline badge" lang="ja">NISA</span>
  <span class="tz-badge tz-badge-outline badge" lang="ja">特定</span>
</div>
</body>
</html>
