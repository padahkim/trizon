<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-stack tz-pad">
  <div class="tz-row">
    <button class="tz-btn tz-btn-primary button-md" type="button">CSV 고르기</button>
    <button class="tz-btn tz-btn-secondary button-md" type="button"><svg class="tz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>시세 새로고침</button>
    <button class="tz-btn tz-btn-ghost button-md" type="button">취소</button>
    <button class="tz-btn tz-btn-danger button-md" type="button">데이터 지우기</button>
  </div>
  <div class="tz-row">
    <button class="tz-btn tz-btn-secondary tz-btn-sm button-sm" type="button"><svg class="tz-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>CSV 올리기</button>
    <button class="tz-btn tz-btn-ghost tz-btn-sm button-sm" type="button">동기화</button>
    <button class="tz-btn tz-btn-ghost tz-btn-icon" type="button" aria-label="증권사 연결"><svg class="tz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tz-btn tz-btn-secondary button-md" type="button" disabled>받는 중</button>
  </div>
</div>
</body>
</html>
