<!-- @dsCard group="Dashboard" height=290 width=960 subtitle="맨 위 합계 · 1단계(엔·달러 따로)" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Summary — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-pad">
<section class="tz-summary" aria-label="합계">
  <div class="tz-summary-block">
    <p class="label tz-sub">엔 자산 <span class="tz-muted">일본주식</span></p>
    <p class="figure-xl">¥20,000</p>
    <dl class="tz-kv body-sm">
      <dt>평가손익</dt><dd><span class="tz-delta tz-rise"><span class="body-sm">+¥1,000</span><span class="caption">+5.26%</span></span></dd>
      <dt>오늘</dt><dd><span class="tz-delta tz-rise"><span class="body-sm">+¥300</span><span class="caption">+1.52%</span></span></dd>
    </dl>
  </div>
  <div class="tz-summary-block">
    <p class="label tz-sub">달러 자산 <span class="tz-muted">미국주식</span></p>
    <p class="figure-xl">$232.00</p>
    <dl class="tz-kv body-sm">
      <dt>평가손익</dt><dd><span class="tz-delta tz-fall"><span class="body-sm">-$8.00</span><span class="caption">-3.33%</span></span></dd>
      <dt>오늘</dt><dd><span class="tz-delta tz-fall"><span class="body-sm">-$1.00</span><span class="caption">-0.43%</span></span></dd>
    </dl>
  </div>
  <div class="tz-summary-meta caption">
    <span class="tz-badge badge">현금 제외</span>
    <span>일본 시세 15:00</span>
    <span>미국 시세 05:00</span>
    <span>마지막 업로드 3일 전</span>
    <button class="tz-btn tz-btn-secondary tz-btn-sm button-sm" type="button"><svg class="tz-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>시세 새로고침</button>
  </div>
</section>
</div>
</body>
</html>
