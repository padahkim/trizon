<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Banner — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-stack tz-pad">
  <div class="tz-banner tz-banner-warning" role="status"><svg class="tz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg><p class="tz-banner-text body-sm">시세를 받지 못했습니다. 모든 종목을 취득가로 보이고 있습니다.</p><button class="tz-btn tz-btn-secondary tz-btn-sm button-sm" type="button"><svg class="tz-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>시세 새로고침</button></div>
  <div class="tz-banner tz-banner-danger" role="alert"><svg class="tz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.1"/></svg><p class="tz-banner-text body-sm">저장되지 않았습니다. 새로고침하면 다시 올려야 합니다.</p></div>
  <div class="tz-banner" role="status"><svg class="tz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.8v.1"/></svg><p class="tz-banner-text body-sm">건너뛴 거래 3건: <span lang="ja">信用</span> 거래는 읽지 않습니다.</p></div>
</div>
</body>
</html>
