<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Dialog — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-scrim" style="min-height:400px;box-sizing:border-box">
  <div class="tz-dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd">
    <h2 class="title-md" id="dt">데이터를 지울까요?</h2>
    <p class="body-md" id="dd">이 브라우저에 저장된 보유와 거래 기록을 모두 지웁니다.</p>
    <div class="tz-banner tz-banner-warning"><svg class="tz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg><p class="tz-banner-text body-sm">2년보다 오래된 거래는 SBI에서 다시 받을 수 없습니다.</p></div>
    <div class="tz-dialog-actions">
      <button class="tz-btn tz-btn-ghost button-md" type="button">취소</button>
      <button class="tz-btn tz-btn-danger button-md" type="button">데이터 지우기</button>
    </div>
  </div>
</div>
</body>
</html>
