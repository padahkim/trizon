<!-- @dsCard group="Forms" height=210 subtitle="증권사 키 입력 · 기본, 오류" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TextInput — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-pad" style="background:var(--surface-raised)">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--spacing-xl);max-width:720px">
  <label class="tz-field">
    <span class="label">앱 키</span>
    <input class="tz-input body-md" type="text" value="PSa1k9x2Rz" autocomplete="off" spellcheck="false">
    <span class="tz-help caption">KB증권 개발자 포털에서 발급받습니다. <a class="tz-link" href="#">발급 페이지<svg class="tz-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v6H4V6h6"/></svg></a></span>
  </label>
  <label class="tz-field">
    <span class="label">앱 시크릿</span>
    <input class="tz-input body-md" type="password" value="wrongsecret" aria-invalid="true" aria-describedby="e1">
    <span class="tz-help tz-help-error caption" id="e1"><svg class="tz-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.1"/></svg>앱 시크릿이 맞지 않습니다. 발급 페이지에서 다시 복사해 주세요.</span>
  </label>
  <label class="tz-field">
    <span class="label">계좌 별칭</span>
    <input class="tz-input body-md" type="text" placeholder="예: 종합계좌">
  </label>
</div>
</div>
</body>
</html>
