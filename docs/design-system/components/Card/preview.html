<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Card — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-pad">
  <section class="tz-card" style="max-width:520px">
    <div class="tz-card-head">
      <div><h3 class="title-md">데이터</h3><p class="body-sm tz-sub" style="margin-top:var(--spacing-xs)">보유 내역은 이 브라우저에만 저장되고 서버로 보내지 않습니다.</p></div>
    </div>
    <div class="tz-inset" style="margin-top:var(--spacing-lg)">
      <dl class="tz-kv body-sm">
        <dt>마지막 업로드</dt><dd>3일 전 (10월 22일 21:14)</dd>
        <dt>저장된 종목</dt><dd>4개</dd>
      </dl>
    </div>
    <div class="tz-row" style="margin-top:var(--spacing-lg)"><button class="tz-btn tz-btn-secondary tz-btn-sm button-sm" type="button">데이터 지우기</button></div>
  </section>
</div>
</body>
</html>
