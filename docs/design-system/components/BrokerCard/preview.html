<!-- @dsCard group="Dashboard" height=360 width=960 subtitle="3단계 한국 증권사 · 연결됨, 동기화 실패, 지원 안 됨" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>BrokerCard — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="tz-pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:var(--spacing-lg);align-items:start">
  <article class="tz-card">
    <div class="tz-card-head">
      <div><h3 class="title-md">KB증권</h3><p class="tz-status caption"><span class="tz-badge tz-badge-ok badge"><span class="tz-dot"></span>연결됨</span>동기화 10:40</p></div>
      <button class="tz-btn tz-btn-ghost tz-btn-sm button-sm" type="button">동기화</button>
    </div>
    <div class="tz-broker-body">
      <div class="tz-acct body-sm"><span class="tz-name">한국주식</span><span class="tz-acct-vals"><span>₩4,820,000</span><span class="tz-rise caption">+₩312,000 (+6.92%)</span></span></div>
      <p class="caption tz-muted" style="margin:var(--spacing-sm) 0 0">해외주식 보유는 API가 주지 않아 빠져 있습니다.</p>
    </div>
  </article>
  <article class="tz-card">
    <div class="tz-card-head">
      <div><h3 class="title-md">토스증권</h3><p class="tz-status caption"><span class="tz-badge tz-badge-danger badge"><span class="tz-dot"></span>동기화 실패</span>키가 만료되었습니다</p></div>
      <button class="tz-btn tz-btn-secondary tz-btn-sm button-sm" type="button">다시 연결</button>
    </div>
    <div class="tz-broker-body">
      <div class="tz-acct body-sm"><span class="tz-name">한국주식</span><span class="tz-acct-vals"><span>₩1,580,000</span><span class="tz-rise caption">+₩42,000 (+2.73%)</span></span></div>
      <div class="tz-acct body-sm"><span class="tz-name">미국주식<span class="tz-badge tz-badge-warning badge">환차손익 빠짐</span></span><span class="tz-acct-vals"><span>₩730,000</span><span class="tz-rise caption">+₩3,000 (+0.41%)</span></span></div>
      <p class="caption tz-muted" style="margin:var(--spacing-sm) 0 0">마지막 성공 10월 24일 09:12의 보유를 합계에 넣고 있습니다.</p>
    </div>
  </article>
  <article class="tz-card">
    <div class="tz-card-head">
      <div><h3 class="title-md">NH투자증권(나무)</h3><p class="tz-status caption"><span class="tz-badge badge">지원 안 됨</span></p></div>
    </div>
    <p class="body-sm tz-sub" style="margin:var(--spacing-lg) 0 0">개인용 API로 보유를 받을 수 없습니다.</p>
  </article>
</div>
</body>
</html>
